<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PE2 Long Case Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg1:#ffdcea; --bg2:#f6d9f5; --bg3:#e3dcfb; --bg4:#d7e8fd;
  --surface:rgba(255,255,255,.72); --ink:#4e3a5e; --muted:#7f6a8e; --line:#e6d8f3;
  --accent:#a878d8; --btn1:#ffc4dc; --btn2:#d9c2f7; --btn3:#bcd8fb;
  --good:#4f9f7c; --mid:#c08a2e; --bad:#d9647a;
  --font:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#f1eaf8}
body{min-height:100vh;background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 35%,var(--bg3) 70%,var(--bg4) 100%) fixed;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
h1{font-weight:700;font-size:19px;margin:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="wait"] i,.sync[data-s="err"] i{background:var(--mid)}
nav{display:flex;gap:4px;padding:12px 0 10px}
nav a{flex:1 1 auto;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 4px;white-space:nowrap;border-radius:999px}
nav a[aria-current="page"]{color:var(--ink);background:rgba(255,255,255,.8)}
main{padding:20px 0 56px;display:flex;flex-direction:column;gap:20px}
.filt summary{cursor:pointer;list-style:none;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.filt summary::-webkit-details-marker{display:none}
.filt summary::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.filt[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px}
.chip{border:0;background:rgba(255,255,255,.6);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--btn1),var(--btn2),var(--btn3));color:var(--ink)}
.panel{background:var(--surface);border-radius:20px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.star{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

.deckbar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(255,255,255,.7);border-radius:3px;overflow:hidden;flex:1}
.bar b{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--btn2),var(--accent))}
.card{width:100%;border:0;text-align:left;padding:32px 26px;min-height:300px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 32px -18px var(--accent)}
.card h2{font-weight:700;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.card li::marker{color:var(--accent)}
.back{margin:0;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.45}
.back dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.back dd{margin:0}
.back strong,.facts strong,.ed b,.ed strong{font-weight:700;background:#fff1a6;border-radius:3px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.casepage{display:flex;flex-direction:column;gap:16px}
.backlink{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;align-self:flex-start}
.ctitle{font-size:24px;line-height:1.2;margin:4px 0 0;font-weight:700;text-wrap:balance}
.sec{padding:16px 18px}
.sec h3{margin:0 0 6px;font-size:11px}
.ed{min-height:28px;font-size:15px;line-height:1.5;border-radius:10px;outline:none;padding:4px 6px;margin:0 -6px;overflow-wrap:anywhere}
.ed:focus{background:rgba(255,255,255,.8);box-shadow:0 0 0 2px var(--btn2)}
.ed:empty::before{content:attr(data-ph);color:#a898b5}
.ed ul,.ed ol{margin:0;padding-left:18px}
.linkbtn{text-align:center;text-decoration:none;color:var(--muted)}
form textarea{resize:vertical;line-height:1.45}
form input,form textarea,form select{font-weight:400;font-size:15px}
h1{display:flex;align-items:center;gap:10px;min-width:0}
h1 a{color:inherit;text-decoration:none}
#titleava{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 4px 10px -4px var(--accent)}
#titleava[hidden],#titleback[hidden]{display:none}
#titleback{margin-right:-4px}
@keyframes avapop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:no-preference){#titleava{animation:avapop .35s cubic-bezier(.2,.9,.3,1.4)}}
nav[hidden]{display:none}
.banner{border-radius:20px;overflow:hidden;height:132px;box-shadow:0 12px 28px -18px var(--accent)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.tile{position:relative;overflow:hidden}
.tile>*{position:relative;z-index:1}
.tile .tban{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.tile.hasban{min-height:132px;justify-content:flex-end}
.tile.hasban::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(255,255,255,.94) 34%,rgba(255,255,255,.1) 80%)}
.tile.editing{gap:10px}
.banbtns{display:flex;flex-wrap:wrap;gap:6px}
.banbtns .chip{background:rgba(255,255,255,.85);padding:6px 10px;font-size:12px}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px var(--ca,#c9b3ee),0 10px 24px -16px var(--ca,#c9b3ee)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ca,#c9b3ee) 35%,transparent),0 14px 28px -14px var(--ca,#c9b3ee)}}
@media (prefers-reduced-motion:no-preference){
  body[data-home] .ctitle,body[data-home] .ctitle+p{animation:rise .45s cubic-bezier(.2,.8,.3,1) backwards}
  body[data-home] .tile{background-size:230% 230%;animation:rise .5s cubic-bezier(.2,.8,.3,1.15) backwards,drift 8s ease-in-out infinite;animation-delay:calc(var(--i,0)*70ms + 80ms),calc(var(--i,0)*-1.1s);transition:transform .18s cubic-bezier(.2,.9,.3,1.5)}
  body[data-home] .tile[aria-pressed="true"]{animation:rise .5s cubic-bezier(.2,.8,.3,1.15) backwards,drift 8s ease-in-out infinite,glow 2.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*70ms + 80ms),0s,.8s}
  body[data-home] .tile:hover{transform:translateY(-3px)}
  body[data-home] .tile:active{transform:scale(.95)}
  body[data-home] .tile .bar b{transform-origin:0 50%;animation:grow .9s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i,0)*70ms + 450ms)}
  body[data-home] .links{animation:rise .45s cubic-bezier(.2,.8,.3,1) backwards}
  body[data-home] .ext{transition:transform .18s cubic-bezier(.2,.9,.3,1.5)}
  body[data-home] .ext:active{transform:scale(.94)}
}
.links{display:flex;flex-direction:column;gap:10px}
.links .row{flex-wrap:nowrap;gap:8px}
.row .btn.ext{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:18px;flex:1 1 0;min-width:0;background:none;color:var(--ink);font-size:12.5px;padding:6px 4px;white-space:nowrap}
.ext img{width:42px;height:42px;object-fit:contain;display:block}
.ext img[src$="focustown.png"]{border-radius:9px}
body[data-home]{--bg1:#fff;--bg2:#fff;--bg3:#fff;--bg4:#fff}
body[data-home] header{background:#fff}
body[data-home] .tile.wide{background:linear-gradient(135deg,#ffe4ee,#eadcfb 55%,#dcebfd)}
body[data-home] .tile.wide .bar{background:rgba(255,255,255,.6)}
[data-p="M"]{--c1:#ffdcea;--c2:#ffc4dc;--c3:#ecd9fb;--c4:#fff1f6;--ca:#d9558f;--cb:#ffb3d1}
[data-p="S"]{--c1:#dcebff;--c2:#bfdaf9;--c3:#cfeef2;--c4:#eef6ff;--ca:#3f78c6;--cb:#a9cdf6}
[data-p="P"]{--c1:#dcf5e4;--c2:#bfe9cd;--c3:#e6f5c9;--c4:#effaf1;--ca:#2f8a5e;--cb:#a8dfbc}
[data-p="O"]{--c1:#ffe6d6;--c2:#ffd0b8;--c3:#ffd6e0;--c4:#fff3ea;--ca:#c96a3a;--cb:#ffc0a1}
[data-p="G"]{--c1:#eddffb;--c2:#dcc6f6;--c3:#f6d6ee;--c4:#f7effd;--ca:#8c5ac6;--cb:#cfb3f1}
[data-p="Y"]{--c1:#d8f2f3;--c2:#b9e5e8;--c3:#cfe0fb;--c4:#ecf9f9;--ca:#27868c;--cb:#a3dbdf}
[data-p="R"]{--c1:#fff3cc;--c2:#ffe6a3;--c3:#ffe0cc;--c4:#fffae6;--ca:#a67a08;--cb:#ffdd85}
body[data-p]{--bg1:var(--c1);--bg2:var(--c2);--bg3:var(--c3);--bg4:var(--c4);--accent:var(--ca);--btn1:var(--c2);--btn2:var(--cb);--btn3:var(--c3);--line:var(--c2)}
.tile[data-p]{background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3))}
.tile[data-p] .bar{background:rgba(255,255,255,.6)}
.tile[data-p] .bar b{background:var(--ca)}
.tile[data-p][aria-pressed="true"]{background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));box-shadow:0 0 0 2px var(--ca),0 10px 24px -16px var(--ca)}
a.chip{text-decoration:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile .tname{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.tile .bar{flex:none;background:rgba(217,194,247,.35)}
.tile[aria-pressed="true"]{background:rgba(255,255,255,.95);box-shadow:0 0 0 2px var(--btn2),0 10px 24px -16px rgba(150,120,215,.6)}
.chip.hl{background:#fff1a6;color:var(--ink)}
.notes{columns:2;column-gap:10px}
.note{break-inside:avoid;margin:0 0 10px;padding:12px 12px 8px;border-radius:14px;background:color-mix(in srgb,var(--c1,#fff) 45%,#fff);border:1px solid color-mix(in srgb,var(--ca,#b99aec) 28%,transparent)}
.note h3{margin:0 0 6px;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.note h3 .muted{font-weight:600;font-size:12px}
.note .item,.note .item:last-child{padding:5px 0;gap:8px;font-size:13.5px;line-height:1.35}
.note .item input[type=checkbox]{width:17px;height:17px;margin-top:1px}
.note .item a{font-weight:500;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.note .dot{width:7px;height:7px;margin-top:6px}
.ticked{margin-top:6px;padding-top:4px;border-top:1px solid color-mix(in srgb,var(--ca,#b99aec) 25%,transparent)}
.ticked summary{cursor:pointer;list-style:none;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0}
.ticked summary::-webkit-details-marker{display:none}
.ticked summary::before{content:"▾ "}
.ticked:not([open]) summary::before{content:"▸ "}
@media (max-width:330px){.notes{columns:1}}
.confbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.6)}
.confbar span{min-width:6px}
.cb1{background:var(--bad)}.cb2{background:var(--mid)}.cb3{background:var(--good)}.cb9{background:rgba(255,255,255,.9)}
.cal{padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(140deg,#fff4f8,#f6effd 55%,#eef5ff);border:1px solid #f0e4f8}
.calhead{display:flex;align-items:center;gap:12px}
.flame{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 6px 14px -8px rgba(255,122,168,.8);filter:grayscale(1);opacity:.55}
.flame.lit{filter:none;opacity:1}
.streak{flex:1;min-width:0;display:flex;flex-direction:column}
.streak strong{font-size:18px;line-height:1.2}
.best{text-align:center;display:flex;flex-direction:column;line-height:1.1}
.best strong{font-size:20px;font-variant-numeric:tabular-nums}
.calnav{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
.calarrow{border:0;background:rgba(255,255,255,.8);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;color:var(--ink)}
.calarrow:disabled{opacity:.3}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cday{border:0;aspect-ratio:1;max-height:40px;border-radius:10px;background:rgba(255,255,255,.65);font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;padding:0}
.cday:disabled{background:none;opacity:.35}
.cday.l1{background:#fbd9e8}.cday.l2{background:#f5b3d0}.cday.l3{background:#ec86b5;color:#fff}.cday.l4{background:linear-gradient(135deg,#e5609e,#a878d8);color:#fff}
.cday.today{box-shadow:inset 0 0 0 2px #a878d8}
.cday.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.daylog{border-top:1px solid #efe2f6;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.dlhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.daylog h3{margin:0;font-size:15px}
.dlsum{margin:0;color:var(--ink)}
.dlsec{display:flex;flex-direction:column;gap:5px}
.dlsec .tag{font-size:10.5px;color:var(--accent)}
.lpills{display:flex;flex-wrap:wrap;gap:6px}
.lpill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.85);font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:none}
.lpill i{width:8px;height:8px;border-radius:50%;flex:none}
.lpill i.c1{background:var(--bad)}.lpill i.c2{background:var(--mid)}.lpill i.c3{background:var(--good)}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(-3deg)}}
@media (prefers-reduced-motion:no-preference){
  body[data-home] .cal,body[data-home] .daybar{animation:rise .45s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:.08s}
  .flame.lit svg{animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
  .cday{transition:transform .15s cubic-bezier(.2,.9,.3,1.5)}
  .cday:not(:disabled):active{transform:scale(.88)}
}
.budlayer{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.buddy{position:absolute;left:0;top:0;width:64px;height:64px;pointer-events:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform}
@media (min-width:500px){.buddy{width:76px;height:76px}}
.buddy.grab{cursor:grabbing}
.bart,.bflip{width:100%;height:100%;transform-origin:50% 100%}
.bflip svg{width:100%;height:100%;display:block;overflow:visible}
.buddy.land .bart{animation:squash .26s ease-out}
@keyframes squash{0%{transform:scale(1.16,.84)}100%{transform:none}}
.bubble{position:absolute;bottom:100%;left:50%;margin-bottom:4px;transform:translate(-50%,6px) scale(.85);background:#fff;color:#4e3a5e;font:700 12px/1.2 Nunito,system-ui,sans-serif;padding:6px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 6px 16px -8px rgba(78,58,94,.55);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.bubble.bl{left:0;transform:translate(0,6px) scale(.85)}.bubble.bl.on{transform:none}
.bubble.br{left:auto;right:0;transform:translate(0,6px) scale(.85)}.bubble.br.on{transform:none}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
.bubble.bl::after{left:26px}.bubble.br::after{left:auto;right:21px}
.bubble.fact{white-space:normal;width:max-content;max-width:236px;font-weight:600;line-height:1.35;padding:8px 11px;pointer-events:none;cursor:pointer}
.bubble.fact.on{pointer-events:auto}
.bubble.fact small{display:block;font-size:10.5px;font-weight:800;color:#a878d8;margin-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.bubble.long{white-space:normal;width:max-content;max-width:200px;text-align:center}
.bfx{position:absolute;left:50%;top:18%;font:900 16px/1 Nunito,system-ui,sans-serif;pointer-events:none;opacity:0;animation:bfx 1.2s ease-out forwards}
@keyframes bfx{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-50px) scale(1.15)}}
.buddy.spin .bart{transform-origin:50% 60%;animation:bspin .65s cubic-bezier(.3,.7,.3,1)}
@keyframes bspin{to{transform:rotate(360deg)}}
.buddy.tumble .bart{transform-origin:50% 55%;animation:bspin .45s linear infinite}
.buddy.shake .bart{animation:bshake .42s ease-in-out}
@keyframes bshake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.buddy.wig .bart{animation:bwig .5s ease-in-out 2}
@keyframes bwig{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.buddy.hopsm .bart{animation:bhop .5s cubic-bezier(.3,.7,.3,1)}
@keyframes bhop{40%{transform:translateY(-14px)}}
.bubble.below{bottom:auto;top:100%;margin:4px 0 0}
.bubble.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#fff}
.mbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.75)}
.mbar strong{flex:1;font-size:14px}
.mdone{align-items:center;text-align:center}
.mdpig{width:120px;margin:4px auto 0}
.pigsvg{display:block;width:100%;height:auto;overflow:visible}
.piggy{display:flex;align-items:center;gap:16px;padding:18px}
.pigart{width:116px;flex:none}
.pigsum{display:flex;flex-direction:column;gap:2px}
.pigtotal{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.pigmove{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 18px;font-size:14px}
.pigmove .btn{flex:none;padding:10px 18px}
.pigamt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px 16px;font-size:14px;font-weight:600}
.pigamt input{width:84px;padding:8px 10px;border:0;border-radius:12px;background:rgba(240,232,252,.9);color:var(--ink);font:inherit;text-align:right}
.pled{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:14px}
.pled .pwhy{flex:1;min-width:0;display:flex;flex-direction:column}
.pled strong{font-variant-numeric:tabular-nums;white-space:nowrap}
.pcoin{display:inline-flex;flex:none}
.ptoast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;background:#fff;color:#4e3a5e;padding:9px 16px 9px 10px;border-radius:999px;box-shadow:0 12px 28px -12px rgba(78,58,94,.55);font-size:13px;max-width:calc(100vw - 32px);transition:opacity .4s,transform .4s}
.ptoast strong{white-space:nowrap}
.ptoast span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}

.item summary::-webkit-details-marker{display:none}
.item.done summary,.plain.done span{color:#a898b5;text-decoration:line-through}
.item ul{margin:8px 0 2px;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:8px;font-size:0;background:currentColor}
.dot.c1{color:var(--bad)}.dot.c2{color:var(--mid)}.dot.c3{color:var(--good)}
.plain{display:flex;gap:12px;align-items:flex-start;padding:11px 18px}
.seq{padding:6px 18px 18px;font-size:14px}
.tablewrap{overflow-x:auto;padding-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 18px;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td:first-child{font-weight:600}

form{padding:20px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
form input,form textarea,form select{padding:10px 14px;border:0;border-radius:14px;background:rgba(240,232,252,.9);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.entry{padding:16px 18px;display:grid;gap:4px}
.entry+.entry{border-top:1px solid var(--line)}
.entry .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.entry .del{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.due{color:var(--bad);font-weight:700}
.empty{padding:24px 18px;color:var(--muted);font-size:14px}
footer{font-size:12px;color:var(--muted);padding-bottom:32px;text-align:center}
@media (max-width:400px){.two{grid-template-columns:1fr}.card h2{font-size:23px}.card{padding:26px 20px}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,nav a{transition:background .15s}}

const CARDS=RAW.map(r=>({p:r[0],sys:r[1],star:r[2],name:r[3],pts:r[4].split('; '),
  id:r[0]+'-'+r[3].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}));

const BASE=CARDS.slice(),DKEY='pe2-deck-v1',ORD={M:0,S:1,P:2,O:3,G:4,Y:5,R:6};
function normDeck(d){d=d||{};return{edit:d.edit||{},add:Array.isArray(d.add)?d.add:[],del:d.del||{}}}
let DK=normDeck(null);try{DK=normDeck(JSON.parse(localStorage.getItem(DKEY)))}catch(e){}
function mk(o,flag){
  const det=Array.isArray(o.det)&&o.det.length===6?o.det.map(x=>String(x||'')):null;
  const c={id:String(o.id),p:PNAME[o.p]?o.p:'M',sys:String(o.sys||''),star:o.star?1:0,name:String(o.name||'Untitled'),det,
    pts:det?det[5].replace(/\*\*/g,'').split('; ').filter(Boolean):(o.pts||[])};
  c[flag]=true;return c;
}
function rebuild(){
  const out=[];
  for(const b of BASE){if(DK.del[b.id])continue;const e=DK.edit[b.id];
    out.push(e?mk({id:b.id,p:b.p,star:b.star,sys:e.sys!=null?e.sys:b.sys,name:e.name||b.name,det:e.det||b.det,pts:b.pts},'edited'):b)}
  DK.add.forEach(a=>{if(a&&a.id)out.push(mk(a,'custom'))});
  const first={};out.forEach((c,i)=>{const k=c.p+'|'+c.sys;if(!(k in first))first[k]=i});
  out.sort((x,y)=>ORD[x.p]-ORD[y.p]||first[x.p+'|'+x.sys]-first[y.p+'|'+y.sys]);
  CARDS.length=0;CARDS.push(...out);
  Object.keys(BYID).forEach(k=>delete BYID[k]);CARDS.forEach(c=>{BYID[c.id]=c});
}
rebuild();
let deckRef=null,deckDirty=false,deckWriting=false,deckTimer=null;
function saveDeck(){
  try{localStorage.setItem(DKEY,JSON.stringify(DK))}catch(e){}
  if(!deckRef)return;deckDirty=true;clearTimeout(deckTimer);deckTimer=setTimeout(flushDeck,700);
}
async function flushDeck(){
  if(!deckRef||deckWriting||!deckDirty)return;deckWriting=true;deckDirty=false;
  try{await deckRef.set(JSON.parse(JSON.stringify(DK)))}catch(e){setSync('err')}
  deckWriting=false;if(deckDirty){clearTimeout(deckTimer);deckTimer=setTimeout(flushDeck,700)}
}
function attachDeck(r){
  deckRef=r;let seeded=false;
  r.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites||deckDirty||deckWriting)return;
    if(snap.exists){
      const inc=normDeck(JSON.parse(JSON.stringify(snap.data())));
      if(JSON.stringify(inc)!==JSON.stringify(DK)){DK=inc;try{localStorage.setItem(DKEY,JSON.stringify(DK))}catch(e){}
        rebuild();if(!busy())render()}
    }else if(!snap.metadata.fromCache&&!seeded&&(DK.add.length||Object.keys(DK.edit).length||Object.keys(DK.del).length)){seeded=true;deckDirty=true;flushDeck()}
  },()=>{deckRef=null});
}

function deckAct(act,v,b){
  if(act==='hlta'){const ta=edTa;if(ta&&ta.selectionEnd>ta.selectionStart){const a=ta.selectionStart,z=ta.selectionEnd,x=ta.value;ta.value=x.slice(0,a)+'**'+x.slice(a,z)+'**'+x.slice(z);ta.focus();ta.setSelectionRange(z+4,z+4)}return true}

  if(act==='backup'){exportBackup();return true}
  if(act==='restoredata'){const f=document.getElementById('restorefile');if(f)f.click();return true}
  if(act==='mood'){S.mood=S.mood||{};S.mood[today()]=v;const ks=Object.keys(S.mood).sort();if(ks.length>60)ks.slice(0,ks.length-60).forEach(k=>delete S.mood[k]);save();render();return true}
  if(act==='examedit'){examEdit=true;render();const i=document.getElementById('examin');if(i)i.focus();return true}
  if(act==='juststart'){if(startMission()){buddyReact('go');if(route()==='cards')render();else location.hash='#cards'}return true}
  if(act==='missionquit'){mission=null;deckKey='';render();return true}
  if(act==='pigmoved'){S.piggy.moved=piggyTotal();save();render();return true}
  if(act==='pigdel'){if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Remove?';return true}S.piggy.ledger=S.piggy.ledger.filter(x=>String(x.t)!==v);S.piggy.moved=Math.min(S.piggy.moved,piggyTotal());save();render();return true}
  if(act==='buddyfacts'){buddyFacts=!buddyFacts;try{localStorage.setItem('pe2-buddy-facts',buddyFacts?'1':'0')}catch(e){}b.setAttribute('aria-pressed',buddyFacts);if(buddyFacts)nextFact=Date.now()+20000;return true}
  if(act==='buddy'){buddyMode=v;try{localStorage.setItem('pe2-buddy',v)}catch(e){}buddiesInit();document.querySelectorAll('[data-act=buddy]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));return true}
  if(act==='banedit'){banEdit=!banEdit;render();return true}
  if(act==='banpick'){banKey=v;const f=document.getElementById('banfile');if(f)f.click();return true}
  if(act==='banrm'){const old=S.ban[v];if(DEFBAN[v])S.ban[v]='none';else delete S.ban[v];save();if(old&&old!=='none'&&assets)assets.delete(old).catch(()=>{});render();return true}
  if(act==='studyconf'){fConf=+v;fStar=false;fHide=false;location.hash='#cards';return true}
  if(act==='calday'){logOpen=!(calSel===v&&logOpen);calSel=v;calRedraw();return true}
  if(act==='calopen'){calOpen=!calOpen;if(!calOpen)logOpen=false;try{localStorage.setItem('pe2-cal-open',calOpen?'1':'0')}catch(e){}calRedraw();return true}
  if(act==='logopen'){logOpen=!logOpen;calRedraw();return true}
  if(act==='calprev'||act==='calnext'){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(act==='calprev'?-1:1),1);calRedraw();return true}
  if(act==='gameopen'){gameOpen=!gameOpen;try{localStorage.setItem('pe2-game-open',gameOpen?'1':'0')}catch(e){}render();return true}
  if(act==='confopen'){confOpen=!confOpen;render();return true}
  if(act==='confclear'){fConf=0;render();return true}
  if(act==='impmode'){impMode=v==='note'?'note':'cards';render();return true}
  if(act==='undelete'){DK.del={};saveDeck();rebuild();render();return true}
  if(act==='delcard'||act==='resetcard'){
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent=act==='delcard'?'Tap again to delete':'Tap again to reset';return true}
    if(act==='resetcard')delete DK.edit[v];

    else{DK.del[v]=true;delete DK.edit[v]}

  return false;
}

function backHTML(c){
  if(!c.det)return '<ul>'+c.pts.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>';
  const filled=c.det.map((t,i)=>[t,i]).filter(x=>x[0].trim());
  if(!filled.length)return '<p class="muted" style="margin:0">No answer written yet. Use Edit this card, or open your notes.</p>';
  const only=filled.length===1&&filled[0][1]===5;
  return '<dl class="back">'+filled.map(([t,i])=>{
    const body=i===5?'<ul>'+t.split('; ').map(x=>'<li>'+rich(x)+'</li>').join('')+'</ul>':rich(t);
    return '<div>'+(only?'':'<dt>'+SECT[i]+'</dt>')+'<dd>'+body+'</dd></div>'}).join('')+'</dl>';
}

function route(){const r=location.hash.slice(1);if(!r)return 'start';if(r.startsWith('case-'))return BYID[r.slice(5)]?'case':'checklist';if(r.startsWith('edit-'))return r==='edit-new'||BYID[r.slice(5)]?'edit':'cards';return VIEWS[r]&&r!=='case'&&r!=='edit'?r:'home'}
function render(){
  const r=route(),themed=r!=='home'&&r!=='start'&&fPost!=='All';
  if(themed)document.body.dataset.p=fPost;else delete document.body.dataset.p;
  document.getElementById('nav').hidden=r==='home'||r==='start';document.querySelector('header').hidden=r==='start';
  document.body.toggleAttribute('data-home',r==='home'||r==='start');gtabSoon();windSync();if(r!=='start'&&mnPrev==='start')setTimeout(mnemDaily,900);mnPrev=r;setTimeout(()=>{sndSync();dumpUpdate()},0);document.documentElement.style.background=r==='home'||r==='start'?'#fff':'';
  const tl=document.getElementById('titlelink');tl.textContent=r==='home'?'PE2 Long Case Cards':specName();document.getElementById('titleback').hidden=r==='home';tl.setAttribute('aria-label',r==='home'?'PE2 Long Case Cards':'Back to specialties, current: '+specName());
  if(['cards','checklist','priority'].includes(r))lastMain=r;
  const nr=r==='exams'?'checklist':r==='drill'||r==='signs'||r==='videos'||r==='rehearse'?'cards':r==='case'?lastMain:r==='import'?'checklist':r==='edit'?(location.hash==='#edit-new'?'checklist':'cards'):r;
  document.querySelectorAll('#nav a').forEach(a=>{if(a.getAttribute('href')==='#'+nr)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  let html=VIEWS[r]();
  if(r!=='home')banEdit=false;
  const ava=document.getElementById('titleava'),hasAva=r!=='home'&&!!banOf(fPost);
  if(hasAva){const u=imgSrc(banOf(fPost));if(ava.getAttribute('src')!==u)ava.setAttribute('src',u)}else ava.removeAttribute('src');
  ava.hidden=!hasAva;
  document.getElementById('view').innerHTML=html;
  const sa=document.querySelector('#view .seg3 [aria-current]');if(sa){const sg=sa.parentNode;sg.scrollLeft=sa.offsetLeft-(sg.clientWidth-sa.offsetWidth)/2}
}

const view=document.getElementById('view');
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const act=b.dataset.act,v=b.dataset.v;
  if(caseAct(act,v,b)||deckAct(act,v,b)||rhAct(act,v))return;
  if(act==='post'){fPost=v}
  else if(act==='star'){fStar=!fStar}
  else if(act==='hide'){fHide=!fHide}
  else if(act==='flip'){flipped=!flipped}
  else if(act==='skip'){pos++;flipped=false}
  else if(act==='rate'){S.conf[deck[pos]]=+v;logAct('r',deck[pos],+v);buddyReact(+v===3?'solid':+v===1?'shaky':'okay');pos++;flipped=false;save();missionCheck();piggyCheck()}
  else if(act==='again'){buildDeck()}
  else if(act==='clearappr'){S.appr={};save()}
  else if(act==='dellog'){S.log=S.log.filter(x=>x.id!==v);save()}
  else return;
  render();
});
view.addEventListener('change',e=>{
  const t=e.target;if(t.id==='restorefile'){if(t.files&&t.files[0])importBackup(t.files[0]);return}
  if(t.id==='examin'){S.exam=t.value||'';examEdit=false;save();render();return}
  if(t.id==='pgw-name'||t.id==='pgw-price'){S.piggy.wish={name:(document.getElementById('pgw-name').value||'').trim().slice(0,60),price:Math.max(0,+document.getElementById('pgw-price').value||0)};save();render();return}
  if(t.id==='vdfile'){const f=t.files&&t.files[0],pv=document.getElementById('vdprev');if(f&&pv){vdErr='';pv.textContent=f.name+' · '+(f.size/1048576).toFixed(1)+' MB';const ti=document.getElementById('vdtitle');if(ti&&!ti.value)ti.value=f.name.replace(/\.[^.]+$/,'').slice(0,80)}return}
  if(t.id==='sgfile'){const f=t.files&&t.files[0],pv=document.getElementById('sgprev');if(f)sgPaste=null;if(f&&pv){const u=URL.createObjectURL(f);pv.innerHTML='<img src="'+u+'" alt="Selected photo">'}return}
  if(t.id==='pigamt'){S.piggy.amt=Math.max(1,Math.round(+t.value||5));t.value=S.piggy.amt;save();return}
  if(t.dataset&&t.dataset.act==='piggoal'){S.piggy.goals[t.dataset.v]=t.checked;save();return}
  if(t.id==='banfile'){setBanner(t.files&&t.files[0]);t.value='';return}
  if(t.id==='picfile'){addPic(t.files&&t.files[0]);t.value='';return}if(!t.dataset||!t.dataset.act)return;
  if(t.dataset.act==='done'){if(t.checked){S.done[t.dataset.v]=true;logAct('d',t.dataset.v);buddyReact('tick');piggyCheck()}else{delete S.done[t.dataset.v];logAct('d',t.dataset.v,null)}save();
    render();}
  else if(t.dataset.act==='appr'){if(t.checked)S.appr[t.dataset.v]=true;else delete S.appr[t.dataset.v];save();t.closest('.plain').classList.toggle('done',t.checked)}
});

  if(e.target.id==='vdform'){e.preventDefault();vdSave(e.target);return}

});

function tabDrag(el,sel,key){
  try{const f=parseFloat(localStorage.getItem(key));if(f>=0&&f<=1)el.style.top=(f*100).toFixed(2)+'%'}catch(e){}
  let d=null;
  el.addEventListener('pointerdown',e=>{const b=e.target.closest(sel);if(!b)return;d={y:e.clientY,top:el.getBoundingClientRect().top,moved:false,id:e.pointerId};});
  el.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id)return;const dy=e.clientY-d.y;
    if(!d.moved&&Math.abs(dy)>6){d.moved=true;try{el.setPointerCapture(d.id)}catch(_){}el.classList.add('dragging')}
    if(d.moved){const b=el.querySelector(sel),h=b?b.offsetHeight:60;el.style.top=Math.max(8,Math.min(innerHeight-h-8,d.top+dy))+'px';el.style.marginTop='';e.preventDefault()}
  });

  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

function noiseBuf(kind,sec){const n=Math.floor(AC.sampleRate*(sec||2)),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let last=0,b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5}else if(kind==='pink'){b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.969*b2+w*0.153852;b3=0.8665*b3+w*0.3104856;b4=0.55*b4+w*0.5329522;b5=-0.7616*b5-w*0.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926}else d[i]=w}return b}
function sndStart(type){

  const out=AC.createGain();out.gain.value=0;out.connect(AC.destination);out.gain.linearRampToValueAtTime((type==='lofi'?0.5:0.55)*(isWind()?0.6:1),AC.currentTime+1.5);

  const gain=v=>{const g=AC.createGain();g.gain.value=v;return g};

    const synth=()=>{
    const bed=gain(1.5),gust=AC.createOscillator(),gg=AC.createGain();gust.frequency.value=0.07;gg.gain.value=0.45;gust.connect(gg);gg.connect(bed.gain);gust.start();S2.srcs.push(gust);

    loop(noiseBuf('brown',5),[filt('lowpass',220),gain(0.12)]);

    let next=AC.currentTime+0.1;
    const drop=(t,heavy)=>{const s=AC.createBufferSource();s.buffer=db;const f=filt('bandpass',heavy?600+Math.random()*700:1800+Math.random()*5200,heavy?2.5:4+Math.random()*6),g=AC.createGain(),len=heavy?0.09:0.018+Math.random()*0.03,v=heavy?0.08:0.015+Math.random()*0.045;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
      s.connect(f);f.connect(g);if(pan){const pn=AC.createStereoPanner();pn.pan.value=Math.random()*1.8-0.9;g.connect(pn);pn.connect(out)}else g.connect(out);
      s.start(t,Math.random()*0.2,len+0.01)};
    S2.timers.push(setInterval(()=>{const end=AC.currentTime+0.25;while(next<end){drop(next,Math.random()<0.04);next+=-Math.log(1-Math.random())/70}if(next<AC.currentTime)next=AC.currentTime+0.05},60));
    };
    const play=buf=>{if(SND!==S2)return;const src=AC.createBufferSource();src.buffer=buf;src.loop=true;src.loopStart=0.06;src.loopEnd=buf.duration-0.06;const g=AC.createGain();g.gain.value=2;const mf=filt('lowpass',6000,0.6),sh=AC.createBiquadFilter();sh.type='highshelf';sh.frequency.value=3000;sh.gain.value=-2.5;src.connect(mf);mf.connect(sh);sh.connect(g);g.connect(out);src.start(0,0.06);S2.srcs.push(src)};
    if(RAINBUF)setTimeout(()=>play(RAINBUF),0);else rainLoad().then(play).catch(()=>{if(SND===S2)synth()});
  }else if(type==='cafe'){
    loop(noiseBuf('brown'),[filt('lowpass',700),gain(0.5)]);
    const g=gain(0.05),lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=0.23;lg.gain.value=0.04;lfo.connect(lg);lg.connect(g.gain);lfo.start();S2.srcs.push(lfo);
    loop(noiseBuf('white'),[filt('bandpass',450,1.2),g]);
    const clink=()=>{const t=AC.currentTime;[2600,3900].forEach((f,i)=>{const o=AC.createOscillator(),gg=AC.createGain();o.frequency.value=f+Math.random()*200;gg.gain.setValueAtTime(0.03/(i+1),t);gg.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.connect(gg);gg.connect(out);o.start(t);o.stop(t+0.55)})};

  }else if(type==='lofi'){
    const lp=filt('lowpass',1300);lp.connect(out);
    loop(noiseBuf('white'),[filt('highpass',3000),gain(0.012)]);

function ddDeck(){const a=ddList();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}a.sort((x,y)=>(S.drill[x.id]||0)-(S.drill[y.id]||0));ddOrder=a.map(x=>x.id);ddPos=0;ddShown=false}
function viewDrill(){
  let h=segHTML('drill');

  if(ddEdit){const f=ddFormHTML();if(f)return h+f}

    return h+'<div class="panel card"><span class="tag">Round done</span><h2>'+ddOrder.length+' signs</h2><ul><li>Shaky: '+n(1)+'</li><li>Okay: '+n(2)+'</li><li>Solid: '+n(3)+'</li></ul></div><div class="row"><button class="btn primary" data-act="ddagain">Go again</button></div>'}

  h+='<div class="row"><button class="del" data-act="ddopen" data-v="'+esc(d.id)+'">Edit</button></div>';

    :'<div class="row"><button class="btn primary" data-act="sgshow">Show</button></div>';

function rhAct(act,v){
  if(!act.startsWith('rh'))return false;
  const now=Date.now(),bud=x=>buddyReact(x===3?'solid':x===1?'shaky':'okay');
  if(act==='rhgo')rhStart(v);
  else if(act==='rhquit')RH=null;
  else if(act==='rhaddmn'){RH=null;sgMode='add';sgNewType='mnemonic';location.hash='signs';return true}
  else if(act==='rhshuffle'){RH.id=rhPick(RH.id);RH.t0=0;RH.end=false;RH.ck=[]}
  else if(act==='rhmin'){const[i,d]=v.split(':').map(Number),m=rhMins().slice(),s=d>0?(m[i]>=10?5:1):(m[i]>10?5:1);m[i]=Math.max(1,Math.min(90,m[i]+d*s));S.reh.mins=m;save()}
  else if(act==='rhstart'){RH.st=0;RH.t0=now;RH.pz=0;RH.m0=now}
  else if(act==='rhpause'){if(RH.pz){RH.t0+=now-RH.pz;RH.pz=0}else RH.pz=now}
  else if(act==='rhnext'){if(RH.pz){RH.t0+=now-RH.pz;RH.pz=0}RH.sec[RH.st]=Math.round(rhEl()/1000);RH.st++;RH.t0=RH.st<4?now:0}
  else if(act==='rhck'){RH.ck[+v]=!RH.ck[+v]}
  else if(act==='rhxt'){RH.xt[+v]=!RH.xt[+v]}
  else if(act==='rhrate'){const id=RH.id,r=+v;S.conf[id]=r;logAct('r',id,r);bud(r);
    if(RH.k==='lc'){RH.sc=RH.ck.filter(Boolean).length;S.reh.lc.push({id,t:now,sc:RH.sc,mx:RCHK.length,sec:RH.sec.reduce((a,b)=>a+(b||0),0)});S.reh.lc=S.reh.lc.slice(-100);
      if(RH.mock){RH.k='mdd';RH.dd=rhShuf(ddList()).sort((a,b)=>(S.drill[a.id]||0)-(S.drill[b.id]||0)).slice(0,5).map(x=>x.id);RH.p=0;RH.sh=false;RH.g=0}else RH.k='lcdone'}
    else{S.reh.p60.push(now);S.reh.p60=S.reh.p60.slice(-300);RH={k:'p60',id:rhPick(id),t0:0,end:false,ck:[],n:(RH.n||0)+1}}
    save();missionCheck();piggyCheck()}
  else if(act==='rhshow')RH.sh=true;
  else if(act==='rhgot'){const ok=v==='1';
    if(RH.k==='mdd')S.drill[RH.dd[RH.p]]=ok?3:1;else{const x=S.signs.find(y=>y.id===RH.ids[RH.p]);if(x)x.conf=ok?3:1}
    if(ok)RH.g++;RH.p++;RH.sh=false;save();
    if(RH.k==='mdd'&&RH.p>=RH.dd.length){const L=exList();RH.dg=RH.g;RH.k='mex';RH.ex=L.length?L[Math.floor(Math.random()*L.length)].id:'';RH.xt=[];RH.t0=now;RH.pz=0}}
  else if(act==='rhxdone'){const x=exFind(RH.ex);RH.xs=Math.round(rhEl()/1000);RH.t0=0;RH.xn=RH.xt.filter(Boolean).length;RH.xm=x?x.s.length:0;RH.tot=Math.round((now-RH.m0)/1000);
    S.reh.mock.push({t:now,id:RH.id,lc:RH.sc,dd:RH.dg,ex:RH.ex,xn:RH.xn,xm:RH.xm,sec:RH.tot});S.reh.mock=S.reh.mock.slice(-50);save();RH.k='mdone'}
  else if(act==='rhp60go'){RH.t0=now;RH.end=false}
  else if(act==='rhp60stop'){RH.sec=Math.min(60,Math.round(rhEl()/1000));RH.end=true}
  else return false;
  render();return true;
}

      :'<a class="vdlink" href="'+esc(v.src)+'" target="_blank" rel="noopener" aria-label="Open '+esc(v.title)+'">'+(ytId(v.src)?'<img class="vdthumb" src="https://i.ytimg.com/vi/'+ytId(v.src)+'/hqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+'<span class="vdplay">'+PLAY+'</span><span class="vdhost">'+esc(vdHost(v.src))+'</span></a>')+
    '<figcaption><strong>'+esc(v.title)+'</strong><button class="gdel" data-act="vddel" data-v="'+esc(v.id)+'" aria-label="Delete '+esc(v.title)+'">×</button></figcaption>'+(v.notes?'<p class="vdnotes">'+esc(v.notes)+'</p>':'')+'</figure>').join('')+'</div>').join('');
}
function vdTopics(){const t=[...new Set(S.vids.map(v=>v.topic).filter(Boolean))];return t.length?'<datalist id="vdtopics">'+t.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>':''}
async function vdSave(form){
  const kind=form.dataset.kind,title=(document.getElementById('vdtitle').value||'').trim().slice(0,80),topic=(document.getElementById('vdtopic').value||'').trim().slice(0,40),notes=(document.getElementById('vdnotes').value||'').trim().slice(0,600);if(!title)return;
  if(kind==='link'){let u=(document.getElementById('vdurl').value||'').trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u)}catch(e){return}
    S.vids.push({id:'v'+Date.now().toString(36),kind:'link',src:u,title,topic,notes,t:Date.now()});save();vdMode='list';render();return}
  const f=document.getElementById('vdfile'),file=f&&f.files&&f.files[0];if(!file){vdErr='Choose a video first';const p=document.getElementById('vdprev');if(p)p.textContent=vdErr;return}
  if(!assets||vdBusy)return;vdBusy=true;vdErr='';const keep=[title,topic];render();
  try{const r=await assets.upload(file);S.vids.push({id:'v'+Date.now().toString(36),kind:'file',src:r.id,title:keep[0],topic:keep[1],t:Date.now()});save();vdBusy=false;vdMode='list';render()}
  catch(e){vdBusy=false;vdErr='Couldn’t save the video';render();const a=document.getElementById('vdtitle'),b=document.getElementById('vdtopic');if(a)a.value=keep[0];if(b)b.value=keep[1]}
}

const PIG='<svg viewBox="0 0 120 100" aria-hidden="true" class="pigsvg"><path d="M20 52 q-9 -3 -7 -11 q7 1 3 8" fill="none" stroke="#4e3a5e" stroke-width="2.6" stroke-linecap="round"/><rect x="32" y="78" width="11" height="13" rx="4" fill="#ffb3cf" stroke="#4e3a5e" stroke-width="2.4"/><rect x="48" y="81" width="11" height="13" rx="4" fill="#ffb3cf" stroke="#4e3a5e" stroke-width="2.4"/><rect x="68" y="81" width="11" height="13" rx="4" fill="#ffb3cf" stroke="#4e3a5e" stroke-width="2.4"/><rect x="84" y="78" width="11" height="13" rx="4" fill="#ffb3cf" stroke="#4e3a5e" stroke-width="2.4"/><path d="M38 32 L43 14 L56 28 Z" fill="#ffb3cf" stroke="#4e3a5e" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="60" cy="56" rx="41" ry="32" fill="#ffc9df" stroke="#4e3a5e" stroke-width="3"/><path d="M30 42 Q36 30 50 27" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" opacity=".85"/><rect x="49" y="25" width="22" height="5" rx="2.5" fill="#4e3a5e"/><ellipse cx="99" cy="59" rx="10" ry="12" fill="#ffb3cf" stroke="#4e3a5e" stroke-width="2.6"/><ellipse cx="96" cy="58" rx="1.7" ry="2.8" fill="#4e3a5e"/><ellipse cx="102" cy="58" rx="1.7" ry="2.8" fill="#4e3a5e"/><circle cx="80" cy="46" r="3.6" fill="#4e3a5e"/><circle cx="81.3" cy="44.7" r="1.2" fill="#fff"/><ellipse cx="82" cy="63" rx="5.5" ry="3.2" fill="#ff8fb5" opacity=".6"/></svg>',COIN='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffd166" stroke="#4e3a5e" stroke-width="2"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#e8a93c" stroke-width="1.5"/><text x="12" y="15" text-anchor="middle" font-family="Nunito,sans-serif" font-size="7" font-weight="900" fill="#8a5a00">RM</text></svg>';
const GOALS=[['mission','Finish a Just start mission','each time'],['cards20','Rate 20 flashcards in a day','once a day'],['cases5','Tick off 5 cases in a day','once a day'],['streak7','Keep up a 7-day streak','every 7 days']];
const fmtRM=n=>(Math.round(n*100)/100).toFixed(n%1?2:0);
const piggyTotal=()=>S.piggy.ledger.reduce((a,x)=>a+(+x.rm||0),0);
function piggyToast(amt,why){
  const t=document.createElement('div');t.className='ptoast';t.setAttribute('role','status');
  t.innerHTML='<span class="pcoin">'+COIN+'</span><strong>+RM '+fmtRM(amt)+'</strong><span>'+esc(why)+'</span>';
  document.body.appendChild(t);setTimeout(()=>t.classList.add('out'),3200);setTimeout(()=>t.remove(),3700);
}
function piggyEarn(goal,why,key){
  const P=S.piggy;if(!P.goals[goal])return 0;if(key&&P.got[key])return 0;
  const amt=P.amt;P.ledger.push({t:Date.now(),d:today(),why,rm:amt});if(key)P.got[key]=1;
  const gk=Object.keys(P.got);if(gk.length>300)gk.slice(0,gk.length-300).forEach(k=>delete P.got[k]);
  save();piggyToast(amt,why);setTimeout(()=>buddyReact('coin'),300);
  const pm=document.querySelector('.pigpill strong');if(pm)pm.textContent='RM '+fmtRM(piggyTotal());
  return amt;
}
function piggyCheck(){
  const a=(S.act||{})[today()]||{},k=today();
  if(Object.keys(a.r||{}).length>=20)piggyEarn('cards20','Rated 20 flashcards today','cards20:'+k);
  if(Object.keys(a.d||{}).length>=5)piggyEarn('cases5','Ticked off 5 cases today','cases5:'+k);
  const st=streaks();if(st.today&&st.cur>0&&st.cur%7===0)piggyEarn('streak7','Kept up a '+st.cur+'-day streak','streak7:'+st.cur+':'+k);
}
let mission=null;
function startMission(){
  let pool=CARDS.filter(c=>fPost==='All'||c.p===fPost);if(!pool.length)pool=CARDS.slice();
  const pick=(arr,n)=>{arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr.slice(0,n).map(c=>c.id)};
  const shaky=pool.filter(c=>S.conf[c.id]===1),fresh=pool.filter(c=>!S.conf[c.id]),okay=pool.filter(c=>S.conf[c.id]===2),pri=pool.filter(isPri);
  const opts=[],N=missionN(),due=pool.filter(isDue);
  if(due.length)opts.push(['cards','Review '+Math.min(N,due.length)+' due card'+(Math.min(N,due.length)===1?'':'s'),pick(due,N),5]);
  if(shaky.length)opts.push(['cards','Rate '+Math.min(N,shaky.length)+' of your Shaky cards',pick(shaky,N),3]);
  if(fresh.length)opts.push(['cards','Try '+Math.min(N,fresh.length)+' cards you haven’t rated yet',pick(fresh,N),2]);
  if(okay.length)opts.push(['cards','Turn '+Math.min(N,okay.length)+' Okay cards into Solid',pick(okay,N),2]);
  if(pri.length)opts.push(['present','Present 1 priority case out loud',pick(pri,1),2]);
  if(!opts.length&&pool.length)opts.push(['cards','Rate '+Math.min(N,pool.length)+' cards',pick(pool,N),1]);
  if(!opts.length)return false;
  let r=Math.random()*opts.reduce((a,o)=>a+o[3],0),o=opts[0];for(const x of opts){r-=x[3];if(r<=0){o=x;break}}
  mission={id:Date.now(),kind:o[0],label:o[1],ids:o[2],done:false,reward:0};
  fStar=false;fHide=false;fConf=0;deckKey='';return true;
}
function missionCheck(){
  if(mission&&!mission.done&&pos>=deck.length){mission.done=true;mission.reward=piggyEarn('mission','Finished a Just start mission');if(!mission.reward)setTimeout(()=>buddyReact('rank'),200)}
}
function missionBar(){return '<div class="mbar"><span class="tag">Just start</span><strong>'+esc(mission.label)+'</strong>'+sndBtn()+'<button class="del" data-act="missionquit">Stop</button></div>'}
function missionDoneHTML(){
  return '<div class="panel card mdone"><span class="tag">Mission complete</span><h2>Nice work!</h2><p style="margin:0">'+(mission.reward?'<strong>+RM '+fmtRM(mission.reward)+'</strong> into your piggy bank.':'Done!')+'</p><div class="mdpig">'+PIG+'</div></div>'+
    '<div class="row"><button class="btn primary" data-act="juststart">Another one</button><a class="btn linkbtn" href="#home">Home</a></div>';
}
function piggyPill(){const tot=piggyTotal();return '<a class="pigpill" href="#piggy" aria-label="Piggy bank, RM '+fmtRM(tot)+' saved">'+PIG+'<strong>RM '+fmtRM(tot)+'</strong></a>'}
function viewStart(){const m=moodToday();return '<div class="startscreen">'+countdownHTML()+(isWind()?'<button class="windchip" data-act="windoff">Wind-down on · turn off tonight</button>':'')+'<div class="moods" role="group" aria-label="How are you feeling?">'+MOODS.map(o=>'<button class="chip" data-act="mood" data-v="'+o[0]+'" aria-pressed="'+(m===o[0])+'">'+o[1]+'</button>').join('')+'</div><button class="gobig" data-act="juststart">Just start</button><a class="goown" href="#home">Study at my own pace</a></div>'}
function viewPiggy(){
  const P=S.piggy,tot=piggyTotal(),owe=Math.max(0,tot-(P.moved||0));
  let h='<a class="backlink" href="#home">← Home</a>';
  h+='<section class="panel piggy"><div class="pigart">'+PIG+'</div><div class="pigsum"><span class="tag">Piggy bank</span><strong class="pigtotal">RM '+fmtRM(tot)+'</strong></div></section>';
  h+=owe>0?'<section class="panel pigmove"><span><strong>RM '+fmtRM(owe)+'</strong> to put into your real savings</span><button class="btn primary" data-act="pigmoved">I’ve saved it</button></section>'
          :'';
  {const w=P.wish,pct=w.price?Math.min(100,Math.round(tot/w.price*100)):0;
  h+='<section class="panel group wish"><h3><span class="tag">Saving for</span></h3><div class="row2"><input id="pgw-name" maxlength="60" placeholder="Bubble tea, a new stethoscope…" aria-label="What you’re saving for" value="'+esc(w.name)+'"><input id="pgw-price" type="number" min="0" step="1" inputmode="decimal" placeholder="RM" aria-label="Price in RM" value="'+(w.price||'')+'"></div>'+
     (w.price?'<div class="wbar'+(tot>=w.price?' full':'')+'"><i style="width:'+pct+'%"></i></div><span class="muted small">RM '+fmtRM(Math.min(tot,w.price))+' / RM '+fmtRM(w.price)+(tot>=w.price?' ✓':'')+'</span>':'')+'</section>';}
  h+='<section class="panel group"><h3><span class="tag">Goals that earn money</span></h3>'+GOALS.map(g=>'<label class="plain"><input type="checkbox" id="pg-'+g[0]+'" data-act="piggoal" data-v="'+g[0]+'"'+(P.goals[g[0]]?' checked':'')+'><span>'+g[1]+' <span class="muted small">· '+g[2]+'</span></span></label>').join('')+
     '<div class="pigamt"><label for="pigamt">Amount per goal (RM)</label><input id="pigamt" type="number" min="1" step="1" inputmode="numeric" value="'+P.amt+'"></div></section>';
  const L=P.ledger.slice().reverse().slice(0,40);
  h+='<section class="panel group"><h3><span class="tag">History</span><span class="muted">'+P.ledger.length+'</span></h3>'+(L.length?L.map(x=>'<div class="pled"><span class="pcoin">'+COIN+'</span><span class="pwhy">'+esc(x.why)+'<span class="muted small">'+esc(new Date(x.t).toLocaleDateString('en-GB',{day:'numeric',month:'short'}))+'</span></span><strong>+RM '+fmtRM(+x.rm)+'</strong><button class="del" data-act="pigdel" data-v="'+x.t+'" aria-label="Remove this entry">✕</button></div>').join(''):'<div class="empty">Nothing yet.</div>')+'</section>';
  return h;
}

render();
buddiesInit();
