<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PE2 Long Case Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PE2 Cards">
<link rel="apple-touch-icon" href="app-180.png">
<link rel="icon" type="image/png" href="app-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one quiet column on a soft pink-to-lilac-to-blue gradient; one thing on screen at a time, filters tucked away. Single light theme by choice. */
:root{
  color-scheme:light;
  --bg1:#ffdcea; --bg2:#f6d9f5; --bg3:#e3dcfb; --bg4:#d7e8fd;
  --surface:rgba(255,255,255,.72); --ink:#4e3a5e; --muted:#7f6a8e; --line:#e6d8f3;
  --accent:#a878d8; --btn1:#ffc4dc; --btn2:#d9c2f7; --btn3:#bcd8fb;
  --good:#4f9f7c; --mid:#c08a2e; --bad:#d9647a;
  --font:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#f1eaf8}
body{min-height:100vh;background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 35%,var(--bg3) 70%,var(--bg4) 100%) fixed;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px}
h1{font-weight:700;font-size:19px;margin:0}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="wait"] i,.sync[data-s="err"] i{background:var(--mid)}
nav{display:flex;gap:4px;padding:12px 0 10px}
nav a{flex:1 1 auto;text-align:center;text-decoration:none;color:var(--muted);font-weight:600;font-size:12.5px;padding:7px 4px;white-space:nowrap;border-radius:999px}
nav a[aria-current="page"]{color:var(--ink);background:rgba(255,255,255,.8)}
main{padding:20px 0 56px;display:flex;flex-direction:column;gap:20px}
.filt summary{cursor:pointer;list-style:none;font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.filt summary::-webkit-details-marker{display:none}
.filt summary::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.filt[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px}
.chip{border:0;background:rgba(255,255,255,.6);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--btn1),var(--btn2),var(--btn3));color:var(--ink)}
.panel{background:var(--surface);border-radius:20px}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.star{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}

.deckbar{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(255,255,255,.7);border-radius:3px;overflow:hidden;flex:1}
.bar b{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--btn2),var(--accent))}
.card{width:100%;border:0;text-align:left;padding:32px 26px;min-height:300px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 32px -18px var(--accent)}
.card h2{font-weight:700;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.card li::marker{color:var(--accent)}
.back{margin:0;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.45}
.back dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.back dd{margin:0}
.back strong,.facts strong,.ed b,.ed strong{font-weight:700;background:#fff1a6;border-radius:3px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.casepage{display:flex;flex-direction:column;gap:16px}
.backlink{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;align-self:flex-start}
.ctitle{font-size:24px;line-height:1.2;margin:4px 0 0;font-weight:700;text-wrap:balance}
.sec{padding:16px 18px}
.sec h3{margin:0 0 6px;font-size:11px}
.ed{min-height:28px;font-size:15px;line-height:1.5;border-radius:10px;outline:none;padding:4px 6px;margin:0 -6px;overflow-wrap:anywhere}
.ed:focus{background:rgba(255,255,255,.8);box-shadow:0 0 0 2px var(--btn2)}
.ed:empty::before{content:attr(data-ph);color:#a898b5}
.ed ul,.ed ol{margin:0;padding-left:18px}
.linkbtn{text-align:center;text-decoration:none;color:var(--muted)}
form textarea{resize:vertical;line-height:1.45}
form input,form textarea,form select{font-weight:400;font-size:15px}
h1{display:flex;align-items:center;gap:10px;min-width:0}
h1 a{color:inherit;text-decoration:none}
#titleava{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 4px 10px -4px var(--accent)}
#titleava[hidden],#titleback[hidden]{display:none}
#titleback{margin-right:-4px}
@keyframes avapop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:no-preference){#titleava{animation:avapop .35s cubic-bezier(.2,.9,.3,1.4)}}
nav[hidden]{display:none}
.banner{border-radius:20px;overflow:hidden;height:132px;box-shadow:0 12px 28px -18px var(--accent)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.tile{position:relative;overflow:hidden}
.tile>*{position:relative;z-index:1}
.tile .tban{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.tile.hasban{min-height:132px;justify-content:flex-end}
.tile.hasban::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(255,255,255,.94) 34%,rgba(255,255,255,.1) 80%)}
.tile.editing{gap:10px}
.banbtns{display:flex;flex-wrap:wrap;gap:6px}
.banbtns .chip{background:rgba(255,255,255,.85);padding:6px 10px;font-size:12px}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px var(--ca,#c9b3ee),0 10px 24px -16px var(--ca,#c9b3ee)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ca,#c9b3ee) 35%,transparent),0 14px 28px -14px var(--ca,#c9b3ee)}}
@media (prefers-reduced-motion:no-preference){
  body[data-home] .ctitle,body[data-home] .ctitle+p{animation:rise .45s cubic-bezier(.2,.8,.3,1) backwards}
  body[data-home] .tile{background-size:230% 230%;animation:rise .5s cubic-bezier(.2,.8,.3,1.15) backwards,drift 8s ease-in-out infinite;animation-delay:calc(var(--i,0)*70ms + 80ms),calc(var(--i,0)*-1.1s);transition:transform .18s cubic-bezier(.2,.9,.3,1.5)}
  body[data-home] .tile[aria-pressed="true"]{animation:rise .5s cubic-bezier(.2,.8,.3,1.15) backwards,drift 8s ease-in-out infinite,glow 2.6s ease-in-out infinite;animation-delay:calc(var(--i,0)*70ms + 80ms),0s,.8s}
  body[data-home] .tile:hover{transform:translateY(-3px)}
  body[data-home] .tile:active{transform:scale(.95)}
  body[data-home] .tile .bar b{transform-origin:0 50%;animation:grow .9s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:calc(var(--i,0)*70ms + 450ms)}
  body[data-home] .links{animation:rise .45s cubic-bezier(.2,.8,.3,1) backwards}
  body[data-home] .ext{transition:transform .18s cubic-bezier(.2,.9,.3,1.5)}
  body[data-home] .ext:active{transform:scale(.94)}
}
.links{display:flex;flex-direction:column;gap:10px}
.links .row{flex-wrap:nowrap;gap:8px}
.row .btn.ext{display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:18px;flex:1 1 0;min-width:0;background:none;color:var(--ink);font-size:12.5px;padding:6px 4px;white-space:nowrap}
.ext img{width:42px;height:42px;object-fit:contain;display:block}
.ext:last-child img{border-radius:9px}
body[data-home]{--bg1:#fff;--bg2:#fff;--bg3:#fff;--bg4:#fff}
body[data-home] header{background:#fff}
body[data-home] .tile.wide{background:linear-gradient(135deg,#ffe4ee,#eadcfb 55%,#dcebfd)}
body[data-home] .tile.wide .bar{background:rgba(255,255,255,.6)}
/* one pastel gradient per discipline: c1-c4 background stops, ca accent, cb button */
[data-p="M"]{--c1:#ffdcea;--c2:#ffc4dc;--c3:#ecd9fb;--c4:#fff1f6;--ca:#d9558f;--cb:#ffb3d1}
[data-p="S"]{--c1:#dcebff;--c2:#bfdaf9;--c3:#cfeef2;--c4:#eef6ff;--ca:#3f78c6;--cb:#a9cdf6}
[data-p="P"]{--c1:#dcf5e4;--c2:#bfe9cd;--c3:#e6f5c9;--c4:#effaf1;--ca:#2f8a5e;--cb:#a8dfbc}
[data-p="O"]{--c1:#ffe6d6;--c2:#ffd0b8;--c3:#ffd6e0;--c4:#fff3ea;--ca:#c96a3a;--cb:#ffc0a1}
[data-p="G"]{--c1:#eddffb;--c2:#dcc6f6;--c3:#f6d6ee;--c4:#f7effd;--ca:#8c5ac6;--cb:#cfb3f1}
[data-p="Y"]{--c1:#d8f2f3;--c2:#b9e5e8;--c3:#cfe0fb;--c4:#ecf9f9;--ca:#27868c;--cb:#a3dbdf}
[data-p="R"]{--c1:#fff3cc;--c2:#ffe6a3;--c3:#ffe0cc;--c4:#fffae6;--ca:#a67a08;--cb:#ffdd85}
body[data-p]{--bg1:var(--c1);--bg2:var(--c2);--bg3:var(--c3);--bg4:var(--c4);--accent:var(--ca);--btn1:var(--c2);--btn2:var(--cb);--btn3:var(--c3);--line:var(--c2)}
.tile[data-p]{background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3))}
.tile[data-p] .bar{background:rgba(255,255,255,.6)}
.tile[data-p] .bar b{background:var(--ca)}
.tile[data-p][aria-pressed="true"]{background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));box-shadow:0 0 0 2px var(--ca),0 10px 24px -16px var(--ca)}
a.chip{text-decoration:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile .tname{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.tile .bar{flex:none;background:rgba(217,194,247,.35)}
.tile[aria-pressed="true"]{background:rgba(255,255,255,.95);box-shadow:0 0 0 2px var(--btn2),0 10px 24px -16px rgba(150,120,215,.6)}
.chip.hl{background:#fff1a6;color:var(--ink)}
.facts{margin:8px 0 2px;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.item a{color:inherit;text-decoration:none;font-weight:600}
.item>a{flex:1;min-width:0}
.item.done>a{color:#a898b5;text-decoration:line-through}
.starbtn{border:0;background:none;color:var(--accent);font-size:20px;line-height:1;padding:2px 4px}
.collage{display:flex;flex-wrap:wrap;padding:10px 6px 22px 24px}
.pic{width:88px;height:88px;padding:0;margin:0 0 -14px -18px;border:3px solid #fff;border-radius:12px;background:#fff;overflow:hidden;position:relative;transform:rotate(var(--r,0deg));box-shadow:0 6px 14px -6px rgba(78,58,94,.5)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.on{transform:scale(1.14);z-index:2;border-color:var(--accent)}
.pic:focus-visible{z-index:3}
.viewer{margin:0 0 14px}
.viewer img{width:100%;border-radius:14px;display:block}
.viewer figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.cropwrap{position:relative;overflow:hidden;border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none}
.cropwrap img{border-radius:0;pointer-events:none}
.cropbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(40,25,55,.5);cursor:move;touch-action:none}
.cropbox i{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--accent);touch-action:none}
.cropbox i[data-h="nw"]{left:-13px;top:-13px;cursor:nwse-resize}.cropbox i[data-h="ne"]{right:-13px;top:-13px;cursor:nesw-resize}
.cropbox i[data-h="sw"]{left:-13px;bottom:-13px;cursor:nesw-resize}.cropbox i[data-h="se"]{right:-13px;bottom:-13px;cursor:nwse-resize}
@keyframes pop{0%{opacity:0;transform:scale(.55) translateY(-28px)}70%{opacity:1;transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){.pic{transition:transform .2s cubic-bezier(.2,.9,.3,1.4)}.viewer:not(.cropping){transform-origin:50% 0;animation:pop .32s cubic-bezier(.2,.8,.3,1)}}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.pics:empty{display:none}
.pics figure{margin:0;display:grid;gap:4px;justify-items:start}
.pics img{width:100%;border-radius:12px;display:block}
.del{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.back ul{padding-left:18px;gap:4px}
.card .hint{margin-top:auto;color:var(--muted);font-size:14px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button,.btn{border:0;background:rgba(255,255,255,.75);border-radius:999px;padding:13px 10px;font-weight:700}
.rate button span{display:none}
.rate .r1{color:var(--bad)}.rate .r2{color:var(--mid)}.rate .r3{color:var(--good)}
.btn.primary{background:linear-gradient(135deg,var(--btn1),var(--btn2),var(--btn3));color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.row .btn:not(.primary){flex:0 1 auto;padding-left:22px;padding-right:22px;color:var(--muted)}

.search{width:100%;padding:12px 18px;border:0;border-radius:999px;background:rgba(255,255,255,.72)}
.search::placeholder,form ::placeholder{color:#a898b5}
.group{overflow:hidden}
.group h3{font-size:13px;margin:0;padding:16px 18px 6px;display:flex;justify-content:space-between;gap:8px}
.group h3 .muted{font-weight:600}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 18px}
.item:last-child,.plain:last-child{padding-bottom:16px}
.item input[type=checkbox],.plain input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.item details{flex:1;min-width:0}
.item summary{cursor:pointer;list-style:none;font-weight:600}
.item summary::-webkit-details-marker{display:none}
.item.done summary,.plain.done span{color:#a898b5;text-decoration:line-through}
.item ul{margin:8px 0 2px;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:8px;font-size:0;background:currentColor}
.dot.c1{color:var(--bad)}.dot.c2{color:var(--mid)}.dot.c3{color:var(--good)}
.plain{display:flex;gap:12px;align-items:flex-start;padding:11px 18px}
.seq{padding:6px 18px 18px;font-size:14px}
.tablewrap{overflow-x:auto;padding-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 18px;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td:first-child{font-weight:600}

form{padding:20px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
form input,form textarea,form select{padding:10px 14px;border:0;border-radius:14px;background:rgba(240,232,252,.9);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.entry{padding:16px 18px;display:grid;gap:4px}
.entry+.entry{border-top:1px solid var(--line)}
.entry .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.entry .del{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.due{color:var(--bad);font-weight:700}
.empty{padding:24px 18px;color:var(--muted);font-size:14px}
footer{font-size:12px;color:var(--muted);padding-bottom:32px;text-align:center}
@media (max-width:400px){.two{grid-template-columns:1fr}.card h2{font-size:23px}.card{padding:26px 20px}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,nav a{transition:background .15s}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1><a href="#home" id="titleback" aria-hidden="true" tabindex="-1" hidden>‹</a><img id="titleava" alt="" hidden><a href="#home" id="titlelink">PE2 Long Case Cards</a></h1>
      <div class="sync" id="sync" data-s="local"><i></i><span id="synctext">Saved on this device</span></div>
    </div>
    <nav id="nav">
      <a href="#cards">Cards</a>
      <a href="#checklist">Checklist</a>
      <a href="#priority">Priority</a>
      <a href="#approach">Approach</a>
      <a href="#log">Log</a>
    </nav>
  </div>
</header>
<div class="wrap">
  <main id="view"></main>
  <footer>Study aid only. Check details against current MOH Malaysia CPGs and your lecture notes.</footer>
</div>

  out.sort((x,y)=>ORD[x.p]-ORD[y.p]||first[x.p+'|'+x.sys]-first[y.p+'|'+y.sys]);

function clean(html){
  const t=document.createElement('template');t.innerHTML=html;
  (function walk(n){[...n.childNodes].forEach(ch=>{
    if(ch.nodeType===1){
      if(OKTAG[ch.tagName]){[...ch.attributes].forEach(a=>ch.removeAttribute(a.name));walk(ch)}
      else if(/^(SPAN|FONT|A|H[1-6]|SECTION|ARTICLE|MARK|SMALL|BLOCKQUOTE)$/.test(ch.tagName)){walk(ch);ch.replaceWith(...ch.childNodes)}
      else ch.remove();
    }else if(ch.nodeType!==3)ch.remove();
  })})(t.content);
  return t.innerHTML;
}

function shrink(file){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    URL.revokeObjectURL(u);cv.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.85)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('load'))};im.src=u})}

async function saveCrop(){
  const id=noteEditing,old=cropId,n=getNote(id),b={...cropBox};if(!assets||!old)return;
  setNoteStatus('Saving crop…');
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('load'));i.src=imgSrc(old)});
    const sx=Math.round(b.x*im.naturalWidth),sy=Math.round(b.y*im.naturalHeight),sw=Math.max(1,Math.round(b.w*im.naturalWidth)),sh=Math.max(1,Math.round(b.h*im.naturalHeight));
    const k=Math.min(1,1600/Math.max(sw,sh)),cv=document.createElement('canvas');cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
    cv.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,cv.width,cv.height);
    const blob=await new Promise((res,rej)=>cv.toBlob(x=>x?res(x):rej(new Error('encode')),'image/jpeg',.9));
    const r=await assets.upload(blob),it=n.imgs.find(x=>x.id===old);
    if(it)it.id=r.id;else n.imgs.push({id:r.id});
    n.t=Date.now();persistNote(id);assets.delete(old).catch(()=>{});

}
let cropDrag=null;
document.addEventListener('pointerdown',e=>{
  const box=e.target.closest&&e.target.closest('#cropbox');if(!box)return;
  const wrap=document.getElementById('cropwrap').getBoundingClientRect();
  cropDrag={h:e.target.dataset.h||'move',px:e.clientX,py:e.clientY,W:wrap.width,H:wrap.height,b:{...cropBox}};
  e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!cropDrag)return;const d=cropDrag,dx=(e.clientX-d.px)/d.W,dy=(e.clientY-d.py)/d.H,m=.12;
  let {x,y,w,h}=d.b,x2=x+w,y2=y+h;
  if(d.h==='move'){x=Math.min(Math.max(0,x+dx),1-w);y=Math.min(Math.max(0,y+dy),1-h)}
  else{
    if(d.h.includes('w'))x=Math.min(Math.max(0,x+dx),x2-m);
    if(d.h.includes('e'))x2=Math.max(Math.min(1,x2+dx),x+m);
    if(d.h.includes('n'))y=Math.min(Math.max(0,y+dy),y2-m);
    if(d.h.includes('s'))y2=Math.max(Math.min(1,y2+dy),y+m);
    w=x2-x;h=y2-y;
  }
  cropBox={x,y,w,h};
  const el=document.getElementById('cropbox');
  if(el){el.style.left=x*100+'%';el.style.top=y*100+'%';el.style.width=w*100+'%';el.style.height=h*100+'%'}
});

  return '<dl class="back">'+c.det.map((t,i)=>{
    const body=i===5?'<ul>'+t.split('; ').map(x=>'<li>'+rich(x)+'</li>').join('')+'</ul>':rich(t);
    return '<div><dt>'+SECT[i]+'</dt><dd>'+body+'</dd></div>'}).join('')+'</dl>';
}

function viewChecklist(){
  const inSpec=CARDS.filter(c=>fPost==='All'||c.p===fPost),tot=inSpec.length,dn=inSpec.filter(c=>S.done[c.id]).length;
  let h='<div class="deckbar"><span>'+dn+' of '+tot+' done</span><span class="bar"><b style="width:'+(tot?dn/tot*100:0)+'%"></b></span></div>';
  h+=chips(false)+'<input class="search" id="search" type="search" placeholder="Search cases" value="'+esc(q)+'" aria-label="Search cases">';
  h+='<div id="list">'+listHTML()+'</div>';
  const nd=Object.keys(DK.del).length;
  h+='<div class="row"><a class="btn linkbtn" href="#edit-new">Add a case</a></div>'+(nd?'<div class="deckbar"><span style="flex:1"></span><button class="del" data-act="undelete">Bring back '+nd+' deleted case'+(nd>1?'s':'')+'</button></div>':'');
  return h;
}
function listHTML(){
  const ql=q.trim().toLowerCase();
  const a=CARDS.filter(c=>matches(c)&&(!ql||c.name.toLowerCase().includes(ql)||c.sys.toLowerCase().includes(ql)));
  if(!a.length)return '<div class="panel empty">No cases match. Clear the search or change the filter.</div>';
  const groups=[];let cur=null;
  for(const c of a){const key=c.p+'|'+c.sys;if(!cur||cur.key!==key){cur={key,p:c.p,sys:c.sys,items:[]};groups.push(cur)}cur.items.push(c)}
  return '<div style="display:flex;flex-direction:column;gap:12px">'+groups.map(g=>{
    const d=g.items.filter(c=>S.done[c.id]).length;
    return '<section class="panel group" data-p="'+g.p+'"><h3><span class="tag">'+PNAME[g.p]+(g.sys?' · '+esc(g.sys):'')+'</span><span class="muted">'+d+' / '+g.items.length+'</span></h3>'+
    g.items.map(c=>{const cf=S.conf[c.id];
      return '<div class="item'+(S.done[c.id]?' done':'')+'"><input type="checkbox" id="cb-'+c.id+'" data-act="done" data-v="'+c.id+'"'+(S.done[c.id]?' checked':'')+' aria-label="'+esc(c.name)+'">'+
        '<a href="#case-'+c.id+'">'+(isPri(c)?'<span class="star">★</span> ':'')+esc(c.name)+'</a>'+
        (cf?'<span class="dot c'+cf+'">'+CONF[cf]+'</span>':'')+'</div>'}).join('')+'</section>'}).join('')+'</div>';
}

function viewApproach(){
  let h='';
  h+='<div class="row"><button class="btn" data-act="clearappr">Clear all ticks</button></div>';
  APPROACH.forEach((sec,si)=>{
    h+='<section class="panel group"><h3><span class="tag">'+esc(sec[0])+'</span></h3>'+sec[1].map((t,i)=>{
      const k=si+'-'+i;
      return '<label class="plain'+(S.appr[k]?' done':'')+'" style="font-size:16px;font-weight:400;color:var(--ink)"><input type="checkbox" id="ap-'+k+'" data-act="appr" data-v="'+k+'"'+(S.appr[k]?' checked':'')+'><span>'+esc(t)+'</span></label>'}).join('')+'</section>';
  });
  h+='<section class="panel group"><h3><span class="tag">Presentation sequence</span></h3><div class="seq">'+SEQ.map((s,i)=>(i+1)+'. '+esc(s)).join(' → ')+'</div></section>';
  h+='<section class="panel group"><h3><span class="tag">Emergencies you must recognise</span></h3><div class="tablewrap"><table><thead><tr><th>Background</th><th>Time-critical complication</th></tr></thead><tbody>'+
     EMERG.map(e=>'<tr><td>'+esc(e[0])+'</td><td>'+esc(e[1])+'</td></tr>').join('')+'</tbody></table></div></section>';
  return h;
}

function viewLog(){
  let h='<section class="panel"><form id="logform">'+
    '<div class="two"><label for="lg-d">Date<input id="lg-d" type="date" value="'+today()+'" required></label>'+
    '<label for="lg-r">Revisit on<input id="lg-r" type="date"></label></div>'+
    '<label for="lg-c">Condition / case<input id="lg-c" list="caselist" required placeholder="e.g. Heart failure"></label>'+
    '<datalist id="caselist">'+CARDS.map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist>'+
    '<label for="lg-w">Weak areas / feedback<textarea id="lg-w" rows="3" placeholder="What the examiner or your friend picked up"></textarea></label>'+
    '<button class="btn primary" type="submit">Add to log</button></form></section>';
  const t=today(),a=S.log.slice().sort((x,y)=>(y.d||'').localeCompare(x.d||''));
  h+='<section class="panel">'+(a.length?a.map(e=>
    '<div class="entry"><div class="h"><strong>'+esc(e.c)+'</strong><span class="muted small">'+esc(e.d||'')+'</span></div>'+
    (e.w?'<div class="small">'+esc(e.w)+'</div>':'')+
    '<div class="h small">'+(e.r?'<span class="'+(e.r<=t?'due':'muted')+'">'+(e.r<=t?'Due for revisit: ':'Revisit: ')+esc(e.r)+'</span>':'<span></span>')+
    '<button class="del" data-act="dellog" data-v="'+esc(e.id)+'">Remove</button></div></div>').join('')
    :'<div class="empty">No practice cases logged yet. Add one after each bedside session.</div>')+'</section>';
  return h;
}

const VIEWS={cards:viewCards,checklist:viewChecklist,priority:viewPriority,approach:viewApproach,log:viewLog,case:viewCase,edit:viewEdit,home:viewHome};
function route(){const r=location.hash.slice(1);if(r.startsWith('case-'))return BYID[r.slice(5)]?'case':'checklist';if(r.startsWith('edit-'))return r==='edit-new'||BYID[r.slice(5)]?'edit':'cards';return VIEWS[r]&&r!=='case'&&r!=='edit'?r:'home'}
function render(){
  const r=route(),themed=r!=='home'&&fPost!=='All';
  if(themed)document.body.dataset.p=fPost;else delete document.body.dataset.p;
  document.getElementById('nav').hidden=r==='home';
  document.body.toggleAttribute('data-home',r==='home');document.documentElement.style.background=r==='home'?'#fff':'';
  const tl=document.getElementById('titlelink');tl.textContent=r==='home'?'PE2 Long Case Cards':specName();document.getElementById('titleback').hidden=r==='home';tl.setAttribute('aria-label',r==='home'?'PE2 Long Case Cards':'Back to specialties, current: '+specName());
  const nr=r==='case'?'checklist':r==='edit'?(location.hash==='#edit-new'?'checklist':'cards'):r;
  document.querySelectorAll('#nav a').forEach(a=>{if(a.getAttribute('href')==='#'+nr)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  let html=VIEWS[r]();
  if(r!=='home')banEdit=false;
  const ava=document.getElementById('titleava'),hasAva=r!=='home'&&!!banOf(fPost);
  if(hasAva){const u=imgSrc(banOf(fPost));if(ava.getAttribute('src')!==u)ava.setAttribute('src',u)}else ava.removeAttribute('src');
  ava.hidden=!hasAva;
  document.getElementById('view').innerHTML=html;
}

/* ---------- events ---------- */
const view=document.getElementById('view');
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const act=b.dataset.act,v=b.dataset.v;
  if(caseAct(act,v,b)||deckAct(act,v,b))return;
  if(act==='post'){fPost=v}
  else if(act==='star'){fStar=!fStar}
  else if(act==='hide'){fHide=!fHide}
  else if(act==='flip'){flipped=!flipped}
  else if(act==='skip'){pos++;flipped=false}
  else if(act==='rate'){S.conf[deck[pos]]=+v;pos++;flipped=false;save()}
  else if(act==='again'){buildDeck()}
  else if(act==='clearappr'){S.appr={};save()}
  else if(act==='dellog'){S.log=S.log.filter(x=>x.id!==v);save()}
  else return;
  render();
});
view.addEventListener('change',e=>{
  const t=e.target;if(t.id==='restorefile'){if(t.files&&t.files[0])importBackup(t.files[0]);return}
  if(t.id==='banfile'){setBanner(t.files&&t.files[0]);t.value='';return}
  if(t.id==='picfile'){addPic(t.files&&t.files[0]);t.value='';return}if(!t.dataset||!t.dataset.act)return;
  if(t.dataset.act==='done'){if(t.checked)S.done[t.dataset.v]=true;else delete S.done[t.dataset.v];save();
    render();}
  else if(t.dataset.act==='appr'){if(t.checked)S.appr[t.dataset.v]=true;else delete S.appr[t.dataset.v];save();t.closest('.plain').classList.toggle('done',t.checked)}
});
['pointerdown','mousedown'].forEach(ev=>view.addEventListener(ev,e=>{if(e.target.closest('[data-act="hl"],[data-act="hlta"]'))e.preventDefault()}));
document.addEventListener('paste',e=>{
  if(route()!=='case')return;
  const cd=e.clipboardData||window.clipboardData,imgs=cd?[...(cd.files||[])].filter(f=>f.type.startsWith('image/')):[];
  if(!imgs.length)return;
  e.preventDefault();e.stopImmediatePropagation();
  if(!assets){setNoteStatus('Pictures are not available in this browser.');return}
  imgs.reduce((q,f)=>q.then(()=>addPic(f)),Promise.resolve());
},true);
view.addEventListener('paste',e=>{if(!e.target.closest('.ed'))return;e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
view.addEventListener('focusin',e=>{if(e.target.tagName==='TEXTAREA'&&e.target.closest('#editform'))edTa=e.target});
view.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('ed'))flushNote()});
view.addEventListener('input',e=>{
  if(e.target.classList.contains('ed')){touchNote();return}
  if(e.target.id==='search'){q=e.target.value;document.getElementById('list').innerHTML=listHTML()}
});
view.addEventListener('submit',e=>{
  if(e.target.id==='editform'){e.preventDefault();saveEdit(e.target);return}
  if(e.target.id!=='logform')return;e.preventDefault();
  const g=id=>document.getElementById(id).value.trim();
  if(!g('lg-c'))return;
  S.log.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:g('lg-d'),c:g('lg-c'),w:g('lg-w'),r:g('lg-r')});
  save();render();
});
document.addEventListener('keydown',e=>{
  if(route()!=='cards'||/INPUT|TEXTAREA/.test(e.target.tagName)||pos>=deck.length)return;
  if(e.key===' '&&e.target.tagName!=='BUTTON'){e.preventDefault();flipped=!flipped;render()}
  else if(flipped&&['1','2','3'].includes(e.key)){S.conf[deck[pos]]=+e.key;pos++;flipped=false;save();render()}
});
window.addEventListener('hashchange',()=>{flushNote();render();window.scrollTo(0,0)});
render();
</script>
